<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конструктор сценариев — Арена переговоров</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
  <header class="top">
    <div class="brand-mark">АП</div>
    <div class="titles">
      <h1>Конструктор сценариев</h1>
      <div class="tagline">Настройка контекста для тренажёра</div>
    </div>
    <a class="nav-link" href="/">← К тренажёру</a>
  </header>

  <div class="card fade-in">
    <label>Название</label>
    <input id="f-title" placeholder="Переговоры о скидке с поставщиком">
    <label>Сфера</label>
    <input id="f-sphere" placeholder="закупки / продажи / HR...">
    <label>Тема переговоров</label>
    <input id="f-topic" placeholder="снижение цены на поставку">
    <label>Сложность</label>
    <select id="f-difficulty">
      <option value="лёгкая">лёгкая</option>
      <option value="средняя" selected>средняя</option>
      <option value="сложная">сложная</option>
    </select>
    <label>Тон собеседника</label>
    <select id="f-tone">
      <option value="дружелюбный">дружелюбный</option>
      <option value="нейтральный" selected>нейтральный</option>
      <option value="жёсткий">жёсткий</option>
    </select>
    <label>Роль оппонента</label>
    <input id="f-role" placeholder="менеджер по продажам поставщика">
    <label>Цели оппонента</label>
    <textarea id="f-goals" placeholder="сохранить цену, продать больше объёма"></textarea>
    <label>Контекст ситуации</label>
    <textarea id="f-context" placeholder="Вы закупщик на заводе, хотите снизить цену на 15%..."></textarea>
    <button id="create-btn">Создать сценарий</button>
  </div>

  <div class="card fade-in">
    <h3 style="margin-top:0;font-family:'Fraunces',serif;font-style:italic;color:var(--paper)">Существующие сценарии</h3>
    <div id="scenario-list">Загрузка...</div>
  </div>
</div>

<script src="/static/js/admin.js"></script>
</body>
</html>
